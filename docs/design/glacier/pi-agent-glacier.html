function filesHTML(){const p=project(),files=fixtures();let f=files.find(x=>x.id===ui.file)||files[0];ui.file=f.id;const lines=ui.codeMode==='full'?f.lines.filter(l=>l[0]!=='-'):f.lines;return `<div class="between"><h2>文件与审阅</h2><span class="tag">${Object.keys(p.reviewed).filter(k=>p.reviewed[k]).length} / ${files.length} 已审阅</span></div><p class="preview-note">示例文件，非真实代码仓库。标记不会提交代码。</p><div class="file-buttons">${files.map(x=>`<button class="file-button ${x.id===f.id?'active':''}" data-action="file" data-id="${x.id}">${I(p.reviewed[x.id]?'check':'file')}<span class="cut grow">${esc(x.path)}</span><span class="diff-count green">+${x.plus}</span></button>`).join('')}</div><div class="between"><span class="muted" style="font-size:11px">${ui.codeMode==='diff'?'统一差异 · 摘录':'修改后 · 片段'}</span><button class="linkbtn" data-action="toggle-code">${ui.codeMode==='diff'?'查看代码':'查看差异'}</button></div><div class="code-container"><div class="code-header"><span class="cut">${esc(f.path.split('/').pop())}</span><button class="iconbtn small" data-action="copy-code" aria-label="复制代码">${I('copy')}</button></div><div class="code-body">${lines.map((l,n)=>`<div class="code-line ${ui.codeMode==='diff'?(l[0]==='+'?'add':l[0]==='-'?'del':''):''}"><span class="line-no">${n+1}</span>${ui.codeMode==='diff'?esc(l[0])+' ':''}${esc(l[1])}</div>`).join('')}</div></div><div class="file-footer"><small>只记录人工审阅状态</small><button class="softbtn ${p.reviewed[f.id]?'':'primary'}" data-action="review-file" data-id="${f.id}">${I(p.reviewed[f.id]?'check':'file')}${p.reviewed[f.id]?'撤销已审阅':'标记已审阅'}</button></div>`}

const glacier = {dockOpen:false,dockHeight:244,dockMax:false,terminalTab:'agent',terminalSessions:new Map(),terminalDrafts:new Map(),usageTab:'run',usageMissing:false,usageStreams:new Map(),lastUsageKey:'',lastOutputKey:'',lastFocus:null};
const mockPrice={uncachedInput:0.8,cachedInput:0.16,output:0.82,currency:'USD',isMock:true};
function money(n,digits=4){return n==null?'—':'$'+Number(n).toFixed(digits)}
function tok(n){if(n==null)return'—';if(n>=1e6)return(n/1e6).toFixed(2).replace(/0+$/,'').replace(/\.$/,'')+'M';if(n>=1000)return(n/1000).toFixed(1).replace(/\.0$/,'')+'K';return String(n)}
function full(n){return n==null?'—':Number(n).toLocaleString('en-US')}
function recordCost(r){if(!r||r.input==null||r.cached==null||r.output==null)return null;return ((r.input-r.cached)*mockPrice.uncachedInput+r.cached*mockPrice.cachedInput+r.output*mockPrice.output)/1e6}
function exampleRecords(){const a=Array.from({length:9},(_,n)=>({id:'sample-history-'+n,input:188000,cached:167320,output:n===0?12000:8000,rounds:2,steps:20,generationMs:38000,ttftMs:420,source:'fixture',status:'complete'}));a.push({id:'sample-latest',input:188000,cached:167320,output:8200,rounds:2,steps:20,generationMs:34600,ttftMs:420,source:'fixture',status:'complete'});return a}
function usageData(s=session()){
 if(!s)return null;
 if(!s.glacierUsage){s.glacierUsage={records:s.id==='s-home'?exampleRecords():[],current:null,contextUsed:s.id==='s-home'?84000:0,contextLimit:200000,source:'fixture'};}
 return s.glacierUsage;
}
function latestUsage(s=session()){const u=usageData(s);return u?.current||u?.records.at(-1)||null}
function totalUsage(s=session()){
 const u=usageData(s);if(!u)return null;const all=[...u.records,...(u.current?[u.current]:[])];if(!all.length)return null;
 return all.reduce((t,r)=>({input:t.input+r.input,cached:t.cached+r.cached,output:t.output+r.output,rounds:t.rounds+r.rounds,steps:t.steps+r.steps,generationMs:t.generationMs+r.generationMs,cost:t.cost+recordCost(r),count:t.count+1}),{input:0,cached:0,output:0,rounds:0,steps:0,generationMs:0,cost:0,count:0});
}
function cacheHit(r){return r&&r.input>0?(r.cached/r.input*100).toFixed(0)+'%':'—'}
function throughput(r){return r&&r.generationMs>0?Math.round(r.output/(r.generationMs/1000)):'—'}
function ringHTML(pct){return `<svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="10"/><circle cx="14" cy="14" r="10"/></svg>`}
function renderUsage(){
 const host=$('#usageStrip');if(!host)return;
 const s=session(),r=latestUsage(),t=totalUsage(),u=usageData();
 const ring=$('#contextButton'),pct=u?Math.round(u.contextUsed/u.contextLimit*100):0;
 ring.style.setProperty('--used',glacier.usageMissing?0:pct);ring.setAttribute('aria-label',glacier.usageMissing?'上下文占用未知':`上下文占用 ${pct}% · 示例`);ring.title=ring.getAttribute('aria-label');
 const key=JSON.stringify([s?.id,r,t?.cost,glacier.usageMissing,u?.contextUsed]);if(key===glacier.lastUsageKey)return;glacier.lastUsageKey=key;
 if(!r&&!glacier.usageMissing){host.innerHTML=`<div class="usage-empty">${I('gauge')} 尚未开始 · 性能与用量将在运行后显示 <button data-action="usage-example">查看指标样例 ${I('chevron')}</button></div>`;return}
 const unknown=glacier.usageMissing;const a=unknown?null:r;
 host.innerHTML=`<div class="usage-top"><button data-action="usage" data-id="run" title="本轮请求次数与工具调用次数">${I('gauge')}<span><strong>${a?a.rounds:'—'}</strong> 轮 <strong>${a?a.steps:'—'}</strong> 步</span></button><button data-action="usage" data-id="speed" title="输出 token ÷ 模型生成时长，排除工具等待"><strong>${throughput(a)}</strong> tok/s</button><span class="usage-sep"></span><button class="usage-total" data-action="usage" data-id="tokens" title="本轮输入（已含缓存读取）+ 输出，不重复加缓存">${I('database')}<strong>${a?tok(a.input+a.output):'—'}</strong> tok</button><button data-action="usage" data-id="cache">缓存 <strong>${cacheHit(a)}</strong></button><span class="usage-sep"></span><button data-action="usage" data-id="cost" title="使用虚构单价计算的本轮估算">≈ <strong>${a?money(recordCost(a),4):'—'}</strong> ${I('chevron')}</button></div><div class="usage-bottom"><span class="demo-pill">${unknown?'指标缺失预览':'模拟指标'}</span><button data-action="usage" data-id="session">本会话 ${!unknown&&t?'≈ '+money(t.cost):'—'}</button><span class="usage-breakdown">· 输入 ${!unknown&&t?tok(t.input):'—'}（含缓存 ${!unknown&&t?tok(t.cached):'—'}） · 输出 ${!unknown&&t?tok(t.output):'—'}</span><button data-action="usage" data-id="definitions">口径 ${I('chevron-down')}</button></div>`;
}

 case 'context-compact':{const u=usageData();if(u){u.contextUsed=Math.round(u.contextUsed*.62);save();renderUsage();renderContext();toast('仅模拟占用减少；没有删除消息或调用模型。')}return}
 case 'effort':effortDialog();return;
 case 'effort-pick':state.effort=d;save();closeDialog();syncComposer();return;
 case 'glass-pick':state.glass=d;save();applyAppearance();settings();$(`[data-action="glass-pick"][data-id="${d}"]`)?.focus({preventScroll:true});return;
 case 'activity':case 'run-info':openPanel('activity');return;
 case 'activity-session':closeOverlays();selectSession(d);return;
 case 'stop-current':if(session())stopRun(session().id);syncComposer();return;
 case 'reference-session':{const s=state.sessions.find(s=>s.id===d);if(s){$('#prompt').value+=($('#prompt').value?' ':'')+'@会话:'+s.title+' ';setDraft($('#prompt').value);closeDialog();syncComposer();$('#prompt').focus()}return}
 case 'branch-session':{if(!session()){toast('先打开一个会话');return}modal('从当前会话分支',`<p>复制已有消息快照，在同一项目下创建新会话。不会创建 Git 分支，不继承单次授权、排队消息、运行任务或消费记录。</p><label class="field">新会话名称<input id="branchSessionName" maxlength="70" value="${esc(session().title+' · 分支')}"></label><div class="dialog-footer"><button class="softbtn" data-action="close-dialog">取消</button><button class="softbtn primary" data-action="branch-session-confirm" data-id="${session().id}">创建分支会话</button></div>`,'branch-session');return}
 case 'branch-session-confirm':{const s=state.sessions.find(s=>s.id===d),name=$('#branchSessionName').value.trim();if(!s||!name)return;const n={id:id('s'),projectId:s.projectId,title:name,time:'刚刚',status:'ready',draft:'',attachments:[],messages:structuredClone(s.messages),queue:[],branchedFrom:s.id};state.sessions.unshift(n);save();closeDialog();selectSession(n.id);toast('已创建独立会话，没有继承执行授权。');return}
 case 'reset':glacier.usageStreams.forEach(clearInterval);glacier.usageStreams.clear();glacier.terminalSessions.clear();glacier.terminalDrafts.clear();glacier.dockOpen=false;glacier.terminalTab='agent';glacier.usageMissing=false;glacier.lastUsageKey='';glacier.lastOutputKey='';break;
 }
 const result=await baseAction(a,d,el);renderUsage();renderDock();return result;
};
// Keep a real keyboard separator, not a decorative drag handle.
$('#dockGrip').addEventListener('pointerdown',e=>{if(innerWidth<=760)return;const start=e.clientY,h=clampDock(glacier.dockHeight);const grip=e.currentTarget;grip.setPointerCapture(e.pointerId);$('#app').style.transition='none';const move=ev=>{glacier.dockHeight=clampDock(h+start-ev.clientY);$('#app').style.setProperty('--dock-height',glacier.dockHeight+'px');grip.setAttribute('aria-valuenow',Math.round(glacier.dockHeight));};const end=()=>{grip.removeEventListener('pointermove',move);grip.removeEventListener('pointerup',end);grip.removeEventListener('pointercancel',end);$('#app').style.transition='';applyLayout()};grip.addEventListener('pointermove',move);grip.addEventListener('pointerup',end);grip.addEventListener('pointercancel',end);});
$('#dockGrip').addEventListener('keydown',e=>{if(!['ArrowUp','ArrowDown','Home','End'].includes(e.key))return;e.preventDefault();glacier.dockHeight=e.key==='Home'?160:e.key==='End'?maxDock():clampDock(glacier.dockHeight+(e.key==='ArrowUp'?20:-20));applyLayout()});
$('#terminalInput').addEventListener('input',e=>glacier.terminalDrafts.set(draftKey(),e.target.value));
$('#terminalInput').addEventListener('keydown',e=>{if(e.isComposing||e.keyCode===229)return;if(e.key==='Enter'){e.preventDefault();terminalSubmit()}if(e.ctrlKey&&e.key.toLowerCase()==='l'){e.preventDefault();action('dock-clear')}});
// Only override shortcuts explicitly intended for this product; never intercept IME composition.
document.addEventListener('keydown',e=>{if(e.isComposing||e.keyCode===229||$('#dialog').open)return;if(e.ctrlKey&&e.code==='Backquote'){e.preventDefault();setDock(!glacier.dockOpen)}});
// Roving radio keyboard behavior for the custom effort picker.
$('#dialog').addEventListener('keydown',e=>{if(ui.dialogType!=='effort'||!['ArrowDown','ArrowUp','ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const els=[...$('#dialog').querySelectorAll('[role=radio]')],i=els.indexOf(document.activeElement);const n=e.key==='Home'?0:e.key==='End'?els.length-1:(i+(['ArrowDown','ArrowRight'].includes(e.key)?1:-1)+els.length)%els.length;const el=els[n];state.effort=el.dataset.id;els.forEach(x=>{x.setAttribute('aria-checked',String(x===el));x.tabIndex=x===el?0:-1});el.focus();save();syncComposer();});
window.addEventListener('resize',()=>{if(innerWidth<=760&&glacier.dockOpen&&!ui.overlay)ui.overlay='dock';if(innerWidth>760&&ui.overlay==='dock')ui.overlay=null;applyLayout()});
window.addEventListener('pagehide',()=>{glacier.usageStreams.forEach(clearInterval)});
// Stale running records are partial previews after reload; they never restart a task.
for(const s of state.sessions){if(s.glacierUsage?.current){s.glacierUsage.records.push({...s.glacierUsage.current,status:'partial'});s.glacierUsage.current=null;}}
$('#brandLogo').innerHTML=logo;hydrate();$('#contextButton').innerHTML=ringHTML(0);render(true);

</script>
</body>
