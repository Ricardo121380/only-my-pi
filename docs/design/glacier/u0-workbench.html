*{box-sizing:border-box}body{margin:0}button,textarea,select{font:inherit;color:inherit}button,select{min-height:40px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:8px 12px;cursor:pointer;transition:background 190ms,box-shadow 190ms}button:hover{background:var(--surface2)}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button.primary{background:#456BE5;color:white;border-color:transparent}button.primary:hover{background:#3559C8}button.quiet{background:transparent;border-color:transparent}p,h1,h2,h3{margin:0}p+p{margin-top:12px}small,.muted{color:var(--muted)}h1{font-size:32px;font-weight:630;letter-spacing:-1px}h2{font-size:22px;letter-spacing:-.4px}h3{font-size:15px}svg{width:18px;height:18px;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.icon{display:inline-flex;align-items:center;gap:9px}.reviewbar{min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:5px 18px;background:var(--surface);border-bottom:1px solid var(--line);font-size:12px}.reviewbar label{display:flex;align-items:center;gap:8px}.reviewbar select{font-size:12px;min-height:34px;padding:3px 8px}.shell{display:grid;grid-template-columns:262px minmax(0,1fr);height:calc(100dvh - 48px);min-height:520px}.sidebar{padding:24px 16px;display:flex;flex-direction:column;gap:20px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--surface) 35%,transparent)}.brand{font-size:19px;letter-spacing:-.7px;padding:0 10px;display:flex;align-items:center;gap:10px}.brandmark{width:30px;height:30px;display:grid;place-items:center;color:var(--accent);background:var(--surface);border-radius:10px;border:1px solid var(--line)}.navgroup{display:grid;gap:5px}.navgroup button{text-align:left;background:transparent;border-color:transparent;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.navgroup button.selected{background:var(--surface);box-shadow:0 2px 8px #334d7708;border-color:var(--line)}.navlabel{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);padding:8px 12px}.sidebar footer{margin-top:auto;padding-top:24px}.dot{width:6px;height:6px;border-radius:100%;background:var(--good);display:inline-block;margin-right:7px}.workspace{min-width:0;display:flex;flex-direction:column;overflow:hidden}.header{height:78px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 32px;gap:12px}.header p{font-size:12px;color:var(--muted)}.actions{display:flex;gap:6px;align-items:center}.menu{display:none}.thread{overflow:auto;flex:1;min-height:0;padding:32px max(32px,calc((100% - 840px)/2));scrollbar-gutter:stable}.home{padding-top:clamp(10px,7vh,100px)}.eyebrow{color:var(--accent);font-size:12px;letter-spacing:1.2px;margin-bottom:18px}.lead{color:var(--muted);margin-top:15px;max-width:500px}.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:36px}.suggestions button{padding:20px;text-align:left;border-radius:18px;background:color-mix(in srgb,var(--surface) 80%,transparent)}.suggestions small{display:block;margin-top:8px;font-size:12px}.message{margin-bottom:28px;max-width:100%;overflow-wrap:anywhere}.user{background:var(--surface2);border-radius:20px;padding:15px 20px;margin-left:auto;max-width:85%;width:fit-content}.byline{display:flex;gap:9px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:14px}.avatar{color:var(--accent);border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:2px 7px}.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:21px;margin:18px 0}.step{display:grid;grid-template-columns:19px 1fr;gap:9px;margin:11px 0}.status{color:var(--accent);font-size:12px;margin-bottom:12px}.good{color:var(--good)}.warn{color:var(--warn)}details{margin-top:18px}summary{cursor:pointer;font-size:12px;color:var(--muted);padding:8px 0}pre{background:var(--surface2);border-radius:12px;padding:14px;overflow:auto;font:12px/1.8 ui-monospace,SFMono-Regular,monospace}.composer-wrap{padding:12px max(32px,calc((100% - 840px)/2)) 20px}.queue:empty{display:none}.queue{padding:10px 16px;font-size:12px;border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;background:var(--surface)}.composer{padding:16px;border-radius:26px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}textarea{width:100%;resize:vertical;min-height:64px;max-height:180px;background:transparent;border:0;padding:5px;outline-offset:1px;line-height:1.7}textarea::placeholder{color:var(--muted)}.tools{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.toolgroup{display:flex;gap:4px;align-items:center;flex-wrap:wrap}.tools button,.tools select{font-size:12px}.usage{display:flex;align-items:center;justify-content:space-between;margin-top:9px;font-size:11px;gap:10px}.usage button{padding:0 4px;min-height:32px;font-size:11px}.tag{font-size:11px;color:var(--accent);background:var(--soft);padding:4px 8px;border-radius:7px}.material{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.hidden{display:none!important}dialog{color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:24px;width:min(700px,calc(100% - 32px));max-height:85dvh;padding:0;box-shadow:0 24px 80px #15223b33}dialog::backdrop{background:#0d193b55;backdrop-filter:blur(4px)}.dialog-head{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--line);background:var(--surface);z-index:1}.dialog-body{padding:24px;overflow-wrap:anywhere}.dialog-body>p{color:var(--muted)}.dialog-body label{display:block;margin:14px 0}.dialog-body select{max-width:100%}.dialog-body button{margin:4px 3px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--surface);border-radius:12px;padding:10px 16px;z-index:8;max-width:90%;font-size:12px}.toast:empty{display:none}.section-gap{margin-top:24px}.diffadd{color:var(--good)}.diffdel{color:var(--warn)}

<script>
const $=s=>document.querySelector(s);let state='home',queue=[],noticeTimer;const esc=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');const byline='<div class="byline"><span class="avatar">G</span>Glacier <span>· 合成演示内容</span></div>';const steps='<div class="step"><span class="good">✓</span><div>确认会话身份与当前项目<small style="display:block">没有恢复旧的写入授权</small></div></div><div class="step"><span class="good">✓</span><div>读取相关实现与回归用例</div></div>';
function notify(t){$('#notice').textContent=t;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('#notice').textContent='',4500)}
function render(next){state=next;$('#scenario').value=next;$('#attachment').classList.toggle('hidden',next!=='materials');$('#delivery').classList.toggle('hidden',next!=='running');$('#title').textContent=next==='home'?'only-my-pi':'打磨连续对话体验';$('#subtitle').textContent=next==='home'?'新的想法，从这里开始':next==='running'?'正在执行 · 补充将在可接收位置生效':'当前会话 · 发送即继续，不会新建';
const opening='<div class="message user">把历史会话的继续操作做得更自然，并保留失败恢复的线索。</div><div class="message">'+byline;
const scenes={home:'<div class="home"><p class="eyebrow">YOUR WORK, IN FOCUS</p><h1>今天，想一起完成什么？</h1><p class="lead">从一个问题、一段代码或一张设计图开始。<br>过程看得见，重要的决定由你掌握。</p><div class="suggestions"><button data-suggestion="梳理当前项目，找出需要优先处理的问题">梳理项目脉络<small>理解结构、入口与关键约束</small></button><button data-suggestion="审查最近改动，检查遗漏的回归用例">检查最近的改动<small>聚焦差异、风险和验证结果</small></button></div></div>',history:opening+'<p>已保留这次讨论与材料引用。你可以直接继续；项目文件仍是当前版本。</p><div class="card"><h3>上次停在这里</h3><p class="muted">已定位默认续接的入口。尚未修改文件，也没有待审批操作。</p></div><button data-panel="branch">从这条消息分支</button></div>',running:opening+'<p>我正在验证会话恢复边界，接下来会核对异常后的队列状态。</p><div class="card"><p class="status">正在运行测试 · 当前工具继续执行</p>'+steps+'<div class="step"><span>◉</span><div>验证断连与恢复行为<small style="display:block">等待命令退出；没有估算完成百分比</small></div></div><details><summary>查看命令与工具细节</summary><pre>node --test tests/session-resume.test.mjs\n[演示输出，不是真实执行]</pre></details></div><button data-action="stop">停止任务</button></div>',approval:opening+'<p>继续前，需要你决定是否允许这次修改。</p><div class="card"><p class="status warn">等待你的审批</p><h3>仅修改本次任务涉及的文件</h3><p class="muted">范围：webui/src/Composer.tsx<br>本次授权不用于其他会话或排队任务。</p><div class="section-gap"><button class="primary" data-action="approve">允许本次操作（演示）</button> <button data-action="deny">拒绝</button></div></div></div>',materials:opening+'<p>文档已加入草稿，但还不能发送。</p><div class="card"><p class="status warn">需要处理 · 超过页数限制</p><h3>需求说明.pdf · 218页</h3><p class="muted">支持文字型PDF，不识别扫描图像。请选择要使用的页面；不会静默丢弃剩余内容。</p><button class="section-gap" data-panel="material">选择范围并预览</button></div></div>',result:opening+'<h2>修改已完成，回归通过。</h2><p class="lead">历史会话可以直接继续，异常时待处理消息保持暂停。下面是演示结果，不代表产品代码已修改。</p><div class="card"><p class="status good">已修改 2 个文件 · 验证通过</p><button class="quiet" data-panel="review">Composer.tsx <span class="muted">+18 −7</span></button><br><button class="quiet" data-panel="review">session-resume.test.mjs <span class="muted">+26</span></button><details><summary>验证与遗留事项</summary><p class="muted">示例：6项通过。真实Provider验收仍需单独授权。</p></details></div><button data-panel="review">逐文件审查</button></div>',failed:opening+'<h2>连接中断，队列已暂停。</h2><p class="lead">草稿和待处理消息仍保留。先核对实际执行状态，不自动重试写入或付费请求。</p><div class="card">'+steps+'<div class="step"><span class="warn">!</span><div>最后一次投递的消费状态未知<small style="display:block">恢复连接后按消息ID查询，不能再次发送来探测。</small></div></div></div><button class="primary" data-action="recover">核对状态（演示）</button></div>',settings:'<div class="home"><p class="eyebrow">WORKSPACE SETTINGS</p><h1>适合你的工作方式。</h1><p class="lead">默认配置覆盖日常使用；项目可以有自己的例外。正在运行的任务不会被设置变更打断。</p><div class="suggestions"><button data-panel="capability">技能与工具<small>查看来源、必需能力与下次生效项</small></button><button data-panel="settings">项目与偏好<small>查看覆盖关系、布局与主题</small></button></div></div>'};$('#thread').innerHTML=scenes[next];$('#thread').scrollTop=0;renderQueue()}
function renderQueue(){$('#queue').innerHTML=queue.map((q,i)=>'<div>'+esc(q.mode)+' · '+esc(q.text)+' <button class="quiet" data-remove="'+i+'">移除未投递项</button></div>').join('')}
const panels={review:['修改审查','<p>仅展示合成差异。已应用、验证结果和来源分别记录。</p><h3 class="section-gap">Composer.tsx</h3><pre><span class="diffdel">− target: newSession()</span>\n<span class="diffadd">+ target: selectedSession.id</span></pre><p>验证：示例6项通过。此处不提供一键回滚，以免覆盖用户改动。</p>'],material:['材料与来源','<p>支持文件引用、图片、文字型PDF和现代Office。这里是范围选择演示，没有实际上传或解析。</p><div class="card"><h3>需求说明.pdf</h3><p>218页 · 超过200页上限</p><label>本次范围 <select id="pages"><option>第1–20页</option><option>第21–40页</option></select></label><pre>来源：第1页\n目标：让持续对话更顺畅</pre><button class="primary" data-action="range">确认演示范围</button></div>'],usage:['任务与会话用量','<p>本稿没有Provider连接，全部数值未知，不显示虚构的0。</p><div class="card">本次任务：未知<br>会话累计：未知<br>主Agent / 子Agent：未采集<br>上下文占用 / 输出速度：缺少请求级事件<br>费用：估算值不是供应商账单</div>'],permission:['操作权限','<p>当前为只读分析。发送消息、调整模型或分支对话，不自动授予写入权限。</p><div class="card">需要修改时单独申请范围明确的编程授权。必需权限与写入协调组件不可关闭。</div>'],terminal:['终端 · 设计状态','<p>产品阶段接真实PTY；本样稿没有启动任何命令。</p><div class="card">未连接<br><small>人工终端运行期间占用项目；关闭视图不停止进程。预览服务将单独管理，不能拿人工终端代替并行预览。</small></div><button data-action="terminal">查看连接状态（演示）</button>'],model:['模型与思考强度','<p>选择来自实际账号能力；不支持的强度应显示原因。样稿不调用模型。</p><label>模型 <select><option>演示模型 · 不调用</option></select></label><label>思考强度 <select><option>标准</option><option>低</option><option>高</option></select></label><button data-action="model">保存演示选择</button>'],capability:['技能与工具','<p>GUI默认设置 → 当前项目覆盖 → 下一次执行。CLI/TUI配置保持独立。</p><div class="card"><h3>权限与项目单写保护</h3><p>必需能力 · 不可关闭</p></div><label><input type="checkbox" checked> 启用示例可选技能（仅演示）</label><p>任务进行中修改后，显示待下次执行生效；无法验证来源的资源不自动加载。</p><button data-action="capability">保存为项目覆盖（演示）</button>'],settings:['项目与偏好','<p>保留Glacier风格。右侧默认收起，审查与编辑按需展开。</p><button data-action="theme">切换明暗主题</button><div class="card">布局尺寸将在产品中按本机偏好保存。这里不写入产品配置。</div>'],search:['检索会话','<p>仅检索已登记的项目与会话，不扫描整个磁盘。本稿没有真实索引。</p><button data-action="search">打开匹配历史（演示）</button>'],branch:['分支对话','<p>保留到这条消息的对话和材料引用，项目文件仍是当前版本，不回滚代码。</p><div class="card">不继承写入授权、待处理队列或旧任务消费计数。</div><button data-action="branch">创建分支（演示）</button>'],project:['项目','<p>only-my-pi · 当前已登记项目</p><button data-action="settings">查看项目设置</button>'],navigation:['项目与会话','<button data-action="new">新建会话</button><button data-action="history">打磨连续对话体验</button><button data-action="settings">项目设置</button>']};
function openPanel(name){const [title,body]=panels[name];$('#panel-title').textContent=title;$('#panel-body').innerHTML=body;$('#panel').dataset.panel=name;$('#panel').showModal()}function closePanel(){$('#panel').close()}function toggleTheme(){document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.panel){openPanel(b.dataset.panel);return}if(b.dataset.state){render(b.dataset.state);return}if(b.dataset.suggestion){$('#draft').value=b.dataset.suggestion;$('#draft').focus();return}if(b.dataset.remove!==undefined){queue.splice(+b.dataset.remove,1);renderQueue();return}const action=b.dataset.action;if(!action)return;if(['new','history','settings','search','branch'].includes(action)){closePanel();if(action==='new'){$('#draft').value='';queue=[]}render(action==='new'?'home':action==='settings'?'settings':'history');if(action==='branch')notify('演示分支已建立；未修改项目文件');return}if(action==='stop'||action==='deny'){render('failed');notify('演示状态：停止后队列暂停');return}if(action==='approve'){render('running');return}if(action==='recover'){render('history');notify('演示核对完成，未重放任何真实请求');return}if(action==='range'){closePanel();$('#attachment small').textContent='第1–20页 · 演示快照';notify('仅演示范围确认；没有解析实际文件');return}if(action==='theme'){toggleTheme();return}notify(action==='capability'?'演示设置：待下次执行生效':action==='terminal'?'未连接：样稿不能执行终端命令':'已保存演示选择');if(action==='model')closePanel()});
$('#panel').addEventListener('keydown',e=>{if(e.key!=='Tab')return;const items=[...$('#panel').querySelectorAll('button:not(:disabled),select:not(:disabled),input:not(:disabled),[tabindex="0"]')].filter(n=>n.getClientRects().length);const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}});
$('#scenario').onchange=e=>render(e.target.value);$('#theme').onclick=toggleTheme;$('#close').onclick=closePanel;$('#send').onclick=()=>{const text=$('#draft').value.trim();if(!text){notify('请先填写消息');$('#draft').focus();return}if(state==='materials'){notify('材料仅为演示，不能实际发送');return}if(state==='running'){queue.push({mode:$('#delivery').value==='steer'?'已收到，待生效':'排队，未投递',text});renderQueue();$('#draft').value='';notify('演示消息已保存，未调用模型');return}render('running');$('#draft').value='';notify('进入演示执行状态，未调用模型')};render('home');
</script>
