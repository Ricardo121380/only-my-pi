name: Phase two platform candidates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/linux-candidate.yml
      - packages/distribution/**
      - packages/release-stack/**
      - distribution/toolchain-*.json
      - scripts/build-distribution.mjs
      - scripts/assemble-distribution-cli.mjs
      - scripts/verify-distribution-*.mjs

permissions:
  contents: read

concurrency:
  group: phase-two-candidate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  candidate:
    name: Build ${{ matrix.platform }} candidate only
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux-x64
          - runner: ubuntu-22.04-arm
            platform: linux-arm64
          - runner: macos-14
            platform: darwin-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep git
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - if: runner.os == 'Linux'
        run: node scripts/probe-linux-sandbox.mjs > "$RUNNER_TEMP/sandbox.json"
      - name: Fetch immutable seed for macOS only
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/seed"
          gh release download v0.3.0-preview.1 --repo Ricardo121380/only-my-pi --pattern only-my-pi-0.3.0-preview.1-darwin-arm64-full.tar.gz --dir "$RUNNER_TEMP/seed"
      - name: Build a platform candidate from the exact source
        shell: bash
        run: |
          args=()
          if [ "$RUNNER_OS" = macOS ]; then args=(--seed-bundle "$RUNNER_TEMP/seed/only-my-pi-0.3.0-preview.1-darwin-arm64-full.tar.gz"); fi
          node scripts/build-distribution.mjs --source-commit "$GITHUB_SHA" --version 0.4.0-preview.2 --output "$RUNNER_TEMP/candidate" "${args[@]}"
      - name: Verify npm/npx and offline startup on Node 24
        run: node scripts/verify-distribution-install.mjs "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/node24"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.19.0"
      - name: Verify npm/npx and offline startup on Node 22
        run: node scripts/verify-distribution-install.mjs "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/node22"
      - name: Verify Full and Thin fallbacks
        run: node scripts/verify-distribution-archives.mjs "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/archives"
      - name: Retain build and acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: platform-candidate-${{ matrix.platform }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/sandbox.json
            ${{ runner.temp }}/candidate/*.tgz
            ${{ runner.temp }}/candidate/*.tar.gz
            ${{ runner.temp }}/candidate/build-receipt.json
            ${{ runner.temp }}/node24/*.json
            ${{ runner.temp }}/node24/*.log
            ${{ runner.temp }}/node22/*.json
            ${{ runner.temp }}/node22/*.log
            ${{ runner.temp }}/archives/*.json
            ${{ runner.temp }}/archives/*.log

  assemble:
    name: Assemble one CLI for all three platforms
    needs: candidate
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: platform-candidate-*
          path: ${{ runner.temp }}/platforms
      - name: Verify all platform identities and assemble without rebuilding runtimes
        run: |
          node scripts/assemble-distribution-cli.mjs "$RUNNER_TEMP/combined" \
            "$RUNNER_TEMP/platforms/platform-candidate-darwin-arm64/candidate" \
            "$RUNNER_TEMP/platforms/platform-candidate-linux-arm64/candidate" \
            "$RUNNER_TEMP/platforms/platform-candidate-linux-x64/candidate"
      - name: Attest main-branch candidate bytes, not product acceptance
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26
        with:
          subject-path: |
            ${{ runner.temp }}/combined/*.tgz
            ${{ runner.temp }}/combined/*.tar.gz
            ${{ runner.temp }}/combined/build-receipt.json
            ${{ runner.temp }}/combined/only-my-pi.rb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: combined-candidate
          path: |
            ${{ runner.temp }}/combined/*.tgz
            ${{ runner.temp }}/combined/*.tar.gz
            ${{ runner.temp }}/combined/build-receipt.json
            ${{ runner.temp }}/combined/only-my-pi.rb

  combined-install:
    name: Combined CLI on ${{ matrix.platform }} Node ${{ matrix.node }}
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux-x64
            node: "22.19.0"
          - runner: ubuntu-22.04
            platform: linux-x64
            node: "24.19.0"
          - runner: ubuntu-22.04-arm
            platform: linux-arm64
            node: "22.19.0"
          - runner: ubuntu-22.04-arm
            platform: linux-arm64
            node: "24.19.0"
          - runner: macos-14
            platform: darwin-arm64
            node: "22.19.0"
          - runner: macos-14
            platform: darwin-arm64
            node: "24.19.0"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep git
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: combined-candidate
          path: ${{ runner.temp }}/combined
      - run: node scripts/verify-distribution-install.mjs "$RUNNER_TEMP/combined" "$RUNNER_TEMP/acceptance"
      - name: Verify final Full/Thin bytes with the shared CLI
        if: matrix.node == '24.19.0'
        run: node scripts/verify-distribution-archives.mjs "$RUNNER_TEMP/combined" "$RUNNER_TEMP/archives"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: combined-install-${{ matrix.platform }}-${{ matrix.node }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/acceptance/*.json
            ${{ runner.temp }}/acceptance/*.log
            ${{ runner.temp }}/archives/*.json
            ${{ runner.temp }}/archives/*.log

  homebrew:
    name: Homebrew product upgrade and lifecycle
    needs: assemble
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: combined-candidate
          path: ${{ runner.temp }}/combined
      - name: Upgrade the public previous version to the exact candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/verify-distribution-homebrew.sh "$RUNNER_TEMP/combined" "$RUNNER_TEMP/homebrew"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: homebrew-candidate-lifecycle
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/homebrew/acceptance.json
            ${{ runner.temp }}/homebrew/*-version.json
            ${{ runner.temp }}/homebrew/*-doctor.json
            ${{ runner.temp }}/homebrew/lifecycle.log
