name: only-my-pi release gates

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-gates:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.19.0", "24.19.0"]
    env:
      CI: "1"
      NO_COLOR: "1"
      PI_TELEMETRY: "0"
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # M10 P1 verifies the preserved M9 source/evidence/merge chain.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate the merged Harness MVP receipt
        if: hashFiles('verification/receipts/2026-08-16-harness-mvp.json') != ''
        run: npm run receipt:check -- --receipt verification/receipts/2026-08-16-harness-mvp.json --source-commit 6941761b3948d96a77596e1302d3205efb5169f1

      - name: Validate the post-merge maintenance receipt when present
        if: hashFiles('verification/receipts/2026-08-17-post-merge-maintenance.json') != ''
        run: npm run receipt:check -- --receipt verification/receipts/2026-08-17-post-merge-maintenance.json --source-commit bff3e3be376bb2ee614a441685e7cab14324727a

      - name: Execute the versioned release-gates-v1 manifest
        run: npm run verify -- --run --output verification/receipts/ci-${{ matrix.node-version }}.json

      - name: Remove ephemeral CI receipt before source-clean gates
        if: always()
        run: rm -f verification/receipts/ci-${{ matrix.node-version }}.json

      - name: Execute the Subagents v2 Preview deterministic gates
        run: npm run verify:subagents:run

      - name: Execute the M8 Daily Harness deterministic gates
        run: npm run verify:m8:run

      - name: Execute the M9 upstream compatibility deterministic gates
        run: npm run verify:m9:run

      - name: Execute the M10 promotion deterministic gates
        run: npm run verify:m10:run

      - name: Execute the M11 Public Preview deterministic gates
        run: npm run verify:m11:run

  m11-q10:
    name: M11 Q10 macOS arm64 clean-home
    needs: release-gates
    runs-on: macos-14-xlarge
    timeout-minutes: 45
    env:
      CI: "1"
      NO_COLOR: "1"
      PI_TELEMETRY: "0"
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 24.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build and run Q10 without retaining RC assets
        run: npm run verify:m11:q10:ci
