name: only-my-pi development CI

on:
  push:
    branches:
      - main
      - codex/dev/pi-native-web
  pull_request:
    branches:
      - main
      - codex/dev/pi-native-web
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "1"
  NO_COLOR: "1"
  PI_TELEMETRY: "0"
  NPM_CONFIG_IGNORE_SCRIPTS: "true"
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_UPDATE_NOTIFIER: "false"

jobs:
  scope:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.plan.outputs.web }}
      cli: ${{ steps.plan.outputs.cli }}
      packaging: ${{ steps.plan.outputs.packaging }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - id: plan
        run: node scripts/ci-plan.mjs

  docs:
    name: Documentation
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - name: Run docs checks with bounded diagnostics
        run: node scripts/ci-run.mjs docs "$RUNNER_TEMP/ci-reports/docs.json"
      - name: Preserve scoped results, including failures and unfinished checks
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-docs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-reports/docs.json
          retention-days: 14
          if-no-files-found: warn

  static:
    name: Shared static checks
    needs: scope
    if: needs.scope.outputs.web == 'true' || needs.scope.outputs.cli == 'true' || needs.scope.outputs.packaging == 'true'
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            contracts/release/external/package-lock.json
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run static checks with bounded diagnostics
        run: node scripts/ci-run.mjs static "$RUNNER_TEMP/ci-reports/static.json"
      - name: Preserve scoped results, including failures and unfinished checks
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-static-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-reports/static.json
          retention-days: 14
          if-no-files-found: warn

  web:
    name: WebUI and native sessions
    needs: scope
    if: needs.scope.outputs.web == 'true'
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            contracts/release/external/package-lock.json
            prototypes/package-lock.json
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install the pinned B2 frontend dependencies
        if: hashFiles('prototypes/package-lock.json') != ''
        run: npm ci --prefix prototypes --ignore-scripts --no-audit --no-fund
      - name: Prepare pinned PTY and extension fixtures
        run: npm run test:prepare
      - name: Run web checks with bounded diagnostics
        run: node scripts/ci-run.mjs web "$RUNNER_TEMP/ci-reports/web.json"
      - name: Preserve scoped results, including failures and unfinished checks
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-web-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-reports/web.json
          retention-days: 14
          if-no-files-found: warn

  cli:
    name: CLI and legacy integrations
    needs: scope
    if: needs.scope.outputs.cli == 'true'
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            contracts/release/external/package-lock.json
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare pinned PTY and extension fixtures
        run: npm run test:prepare
      - name: Run cli checks with bounded diagnostics
        run: node scripts/ci-run.mjs cli "$RUNNER_TEMP/ci-reports/cli.json"
      - name: Preserve scoped results, including failures and unfinished checks
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-cli-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-reports/cli.json
          retention-days: 14
          if-no-files-found: warn

  packaging:
    name: Installation and historical evidence
    needs: scope
    if: needs.scope.outputs.packaging == 'true'
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            contracts/release/external/package-lock.json
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare pinned PTY and extension fixtures
        run: npm run test:prepare
      - name: Run packaging checks with bounded diagnostics
        run: node scripts/ci-run.mjs packaging "$RUNNER_TEMP/ci-reports/packaging.json"
      - name: M11 Q10 macOS arm64 clean-home
        shell: bash
        run: npm run verify:m11:q10:ci 2>&1 | tee "$RUNNER_TEMP/ci-reports/q10.log"
      - name: Preserve scoped results, including failures and unfinished checks
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-packaging-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-reports/*
          retention-days: 14
          if-no-files-found: warn

  required:
    name: CI required
    if: always()
    needs: [scope, docs, static, web, cli, packaging]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - name: Require every selected lane to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          import { requiredFailures } from './scripts/ci-plan.mjs';
          const results = JSON.parse(process.env.RESULTS);
          const outputs = results.scope.outputs;
          if (results.scope.result !== 'success' ||
              ['web', 'cli', 'packaging'].some(key => !['true', 'false'].includes(outputs[key]))) {
            throw new Error('CI scope did not complete with valid outputs');
          }
          const plan = Object.fromEntries(Object.entries(outputs).map(([key, value]) => [key, value === 'true']));
          const failed = requiredFailures(plan, results);
          if (failed.length) throw new Error(`Selected checks failed, were cancelled, or did not run: ${failed.join(', ')}`);
          console.log('All selected CI lanes passed; unselected lanes were skipped.');
          NODE
