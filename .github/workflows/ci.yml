name: only-my-pi release gates

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-gates:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.19.0", "24.x"]
    env:
      CI: "1"
      NO_COLOR: "1"
      PI_TELEMETRY: "0"
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate committed release receipt when present
        if: hashFiles('verification/receipts/2026-08-16-harness-mvp.json') != ''
        run: npm run receipt:check -- --receipt verification/receipts/2026-08-16-harness-mvp.json --expect-parent

      - name: Execute the versioned release-gates-v1 manifest
        run: npm run verify -- --run --output verification/receipts/ci-${{ matrix.node-version }}.json

      - name: Remove ephemeral CI receipt
        if: always()
        run: rm -f verification/receipts/ci-${{ matrix.node-version }}.json
