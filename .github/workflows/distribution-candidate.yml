name: Native distribution candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-candidate-${{ github.sha }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS arm64 build and npm Node 22/24 acceptance
    runs-on: macos-14
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      GH_REPO: Ricardo121380/only-my-pi
      GH_TOKEN: ${{ github.token }}
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm

      - name: Install build dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check distribution boundaries
        run: npm run test:distribution

      - name: Fetch the immutable dependency seed
        run: |
          mkdir "$RUNNER_TEMP/native-seed"
          gh release download v0.3.0-preview.1 --repo "$GH_REPO" --pattern only-my-pi-0.3.0-preview.1-darwin-arm64-full.tar.gz --dir "$RUNNER_TEMP/native-seed"

      - name: Build one source-bound native candidate
        run: |
          node scripts/build-distribution.mjs --source-commit "$GITHUB_SHA" --seed-bundle "$RUNNER_TEMP/native-seed/only-my-pi-0.3.0-preview.1-darwin-arm64-full.tar.gz" --output "$RUNNER_TEMP/native-candidate"
          node scripts/build-homebrew-formula.mjs "$RUNNER_TEMP/native-candidate" "$RUNNER_TEMP/native-candidate/only-my-pi.rb"

      - name: Fresh-cache npm/npx and offline lifecycle acceptance on Node 24
        run: node scripts/verify-distribution-install.mjs "$RUNNER_TEMP/native-candidate" "$RUNNER_TEMP/native-acceptance-node24"

      - name: Full offline and Thin fallback acceptance
        run: node scripts/verify-distribution-archives.mjs "$RUNNER_TEMP/native-candidate" "$RUNNER_TEMP/native-acceptance-archives"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"

      - name: Fresh-cache npm/npx and offline lifecycle acceptance on Node 22
        run: node scripts/verify-distribution-install.mjs "$RUNNER_TEMP/native-candidate" "$RUNNER_TEMP/native-acceptance-node22"

      - name: Attest these candidate bytes (not release approval)
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: |
            ${{ runner.temp }}/native-candidate/*.tgz
            ${{ runner.temp }}/native-candidate/*.tar.gz
            ${{ runner.temp }}/native-candidate/build-receipt.json
            ${{ runner.temp }}/native-candidate/only-my-pi.rb

      - name: Keep exact candidate artifacts and local acceptance identities
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-candidate-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/native-candidate/*.tgz
            ${{ runner.temp }}/native-candidate/*.tar.gz
            ${{ runner.temp }}/native-candidate/build-receipt.json
            ${{ runner.temp }}/native-candidate/only-my-pi.rb
            ${{ runner.temp }}/native-candidate/only-my-pi/package.json
            ${{ runner.temp }}/native-candidate/only-my-pi-runtime-darwin-arm64/package.json
            ${{ runner.temp }}/native-acceptance-node22/acceptance.json
            ${{ runner.temp }}/native-acceptance-node24/acceptance.json
            ${{ runner.temp }}/native-acceptance-archives/acceptance.json
